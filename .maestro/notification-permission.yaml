# Exercises the real Android notification-permission dialog. `unset` leaves the
# permission in the OS "ask" state so the system prompt appears; we tap Allow and
# confirm the app proceeds.
appId: com.azantime.app
---
- launchApp:
    clearState: true
    permissions:
      notifications: unset
# The app requests notification permission only after it has loaded far enough to
# schedule prayers (location → lazy-import notificationService → request), which on
# a dev build is tens of seconds in — so wait for the system dialog before tapping.
- extendedWaitUntil:
    visible: "Allow"
    timeout: 90000
- tapOn: "Allow"
- extendedWaitUntil:
    visible: "Today's Prayers"
    timeout: 90000
